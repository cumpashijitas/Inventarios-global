[project]
name = "inventario-backend"
version = "0.1.0"
description = "SaaS multi-tenant de inventario / ventas / operaciones — backend FastAPI hexagonal"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "gunicorn>=23.0.0",

    # Validación y settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # DB
    "asyncpg>=0.30.0",
    "sqlalchemy>=2.0.36",         # solo para Alembic; queries van con asyncpg directo
    "alembic>=1.14.0",

    # Auth (hablamos con Supabase Auth API directamente vía httpx,
    # NO usamos el SDK supabase-py porque arrastra pyiceberg/storage3 que
    # requieren compilador C++ en Windows y no aportan nada en backend).
    "PyJWT[crypto]>=2.10.0",
    "httpx>=0.28.0",

    # Observabilidad
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.18.0",

    # Util
    "python-dateutil>=2.9.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-python-dateutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# -------------------------------------------------------------------
# uv
# -------------------------------------------------------------------
[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

# -------------------------------------------------------------------
# Ruff (linter + formatter)
# -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "B",          # bugbear
    "UP",         # pyupgrade
    "N",          # naming
    "SIM",        # simplifications
    "RUF",        # ruff-specific
]
ignore = ["E501"]  # line length manejado por formatter

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]

# -------------------------------------------------------------------
# Pytest
# -------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

# -------------------------------------------------------------------
# Mypy
# -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
